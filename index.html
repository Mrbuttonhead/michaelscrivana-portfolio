<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Michael Scrivana — Under Construction</title>
  <meta name="description" content="michaelscrivana.com is being rebuilt. Portfolio work lives at creative.michaelscrivana.com for now.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Michael Scrivana — Under Construction">
  <meta property="og:description" content="This site is being rebuilt. See the current portfolio at creative.michaelscrivana.com.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://michaelscrivana.com/">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/webclip.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --ink: #0a0d12;
      --ink-2: #4a5058;
      --ink-3: #8b9099;
      --accent: #2850D8;
      --border: rgba(10, 13, 18, 0.10);
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(40, 80, 216, 0.10), transparent 60%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .wrap {
      width: min(640px, calc(100% - 48px));
      margin: auto;
      padding: 64px 0;
      text-align: center;
    }
    .mark {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 auto 28px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(34px, 7vw, 52px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 18px;
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    p {
      font-size: 17px;
      line-height: 1.6;
      color: var(--ink-2);
      max-width: 38ch;
      margin: 0 auto 36px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 999px;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    a.btn-primary {
      background: var(--accent);
      color: #fff;
    }
    a.btn-primary:hover { background: #1B3AB0; }
    a.btn-ghost {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
    }
    a.btn-ghost:hover { border-color: rgba(10, 13, 18, 0.28); }
    footer {
      padding: 28px 24px;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    @media (prefers-reduced-motion: reduce) {
      .mark { animation: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark" aria-hidden="true"></div>
    <div class="eyebrow">Under construction</div>
    <h1>This site is being <em>rebuilt.</em></h1>
    <p>michaelscrivana.com is getting a new home. Portfolio work is live at creative.michaelscrivana.com for now.</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://creative.michaelscrivana.com/">View portfolio</a>
      <a class="btn btn-ghost" href="mailto:mkscrivana@gmail.com">Contact</a>
    </div>
  </main>
  <footer>© 2026 Michael Scrivana</footer>
</body>
</html>
